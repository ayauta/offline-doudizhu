name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Set up pnpm
        run: npm install --global pnpm@11.24.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run complete Web gate
        run: pnpm check

  android:
    name: Android package and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Set up pnpm
        run: npm install --global pnpm@11.24.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inspect Web artifact
        run: |
          pnpm build
          pnpm check:bundle
          pnpm check:android
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build debug Android package
        working-directory: android
        run: ./gradlew lintDebug assembleDebug --no-daemon
      - name: Inspect debug APK
        run: scripts/inspect-android-apk.sh android/app/build/outputs/apk/debug/app-debug.apk io.github.ayauta.offlinedoudizhu.debug 0.1.0-debug
      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: scripts/android-emulator-smoke.sh android/app/build/outputs/apk/debug/app-debug.apk io.github.ayauta.offlinedoudizhu.debug
